[project]
name = "bubble"
version = "0.1.0"
description = "Bubble 🫧 - Your personal AI life companion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "neo4j>=5.27.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "aiohttp>=3.13.0",
    "pgvector>=0.4.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.2.0",
    "langchain-core>=1.4.0",
    "langchain-mcp-adapters>=0.2.0",
    "langgraph>=0.5.0",
    "jinja2>=3.1.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
